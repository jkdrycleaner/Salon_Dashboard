<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOURS SALON — Master Settings</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--line:#dfe5e8;--text:#172126;--muted:#6b7a80;--teal:#159a8c;--teal2:#0f776d;--danger:#d9534f;--shadow:0 8px 28px rgba(20,40,45,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20}.menu{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:20px;cursor:pointer}.brand{font-size:19px;font-weight:800;letter-spacing:.5px}.brand span{color:var(--teal)}.spacer{flex:1}.user{font-size:12px;color:var(--muted)}.wrap{max-width:1400px;margin:22px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.head h1{font-size:21px;margin:0}.head p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700}.primary{background:var(--teal);color:#fff}.secondary{background:#eef4f4;color:var(--teal2)}.danger{background:#fff0ef;color:var(--danger)}.table-wrap{overflow:auto}.master-table{width:100%;border-collapse:collapse;min-width:980px}.master-table th{background:#f7f9fa;color:#526168;font-size:11px;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.master-table td{padding:8px 10px;border-bottom:1px solid #edf0f1;vertical-align:middle}.master-table tr:hover td{background:#fbfdfd}.input{width:100%;min-width:80px;height:36px;border:1px solid #ccd7db;border-radius:8px;padding:0 9px;outline:none;background:#fff}.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(21,154,140,.1)}.sr{width:58px}.center{text-align:center}.multi{min-width:180px}.checks{display:flex;flex-wrap:wrap;gap:7px;max-width:260px}.check{display:inline-flex;align-items:center;gap:4px;background:#f2f7f7;border:1px solid #d8e8e6;border-radius:7px;padding:4px 7px;font-size:11px}.check input{accent-color:var(--teal)}.select{height:36px;border:1px solid #ccd7db;border-radius:8px;background:#fff;padding:0 8px;width:100%}.row-actions{display:flex;gap:6px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:7px;width:34px;height:34px;cursor:pointer}.empty{padding:30px;text-align:center;color:var(--muted)}.drawer{position:fixed;left:0;top:0;bottom:0;width:280px;background:#fff;z-index:100;transform:translateX(-100%);transition:.22s;box-shadow:10px 0 30px rgba(0,0,0,.12);padding:18px}.drawer.open{transform:translateX(0)}.drawer h2{font-size:17px;margin:6px 0 18px}.navbtn{width:100%;text-align:left;border:0;background:#f5f7f8;border-radius:10px;padding:12px;margin:4px 0;cursor:pointer;font-weight:700}.navbtn.active{background:#e6f5f3;color:var(--teal2)}.shade{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:90;display:none}.shade.open{display:block}.toast{position:fixed;right:18px;bottom:18px;background:#172126;color:#fff;padding:12px 16px;border-radius:10px;z-index:200;box-shadow:var(--shadow);max-width:360px}.login{max-width:480px;margin:70px auto}.login .body{padding:20px}.login label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.login .input{margin-bottom:12px}.small{font-size:11px;color:var(--muted)}
@media(max-width:700px){.top{padding:0 12px}.brand{font-size:16px}.user{display:none}.wrap{padding:0 10px;margin:12px auto}.head{padding:14px;align-items:flex-start}.head h1{font-size:18px}.actions{margin-left:0}.head{flex-wrap:wrap}.actions{width:100%}.actions .btn{flex:1}.drawer{width:85vw}}
</style>
</head>
<body>
<div class="top"><button class="menu" id="menuBtn">☰</button><div class="brand">YOURS <span>SALON</span></div><div class="spacer"></div><div class="user" id="userEmail"></div></div>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"><h2>Master Settings</h2><button class="navbtn active" data-master="employee">Employee List</button><button class="navbtn" data-master="expense_type">Expense Type</button><button class="navbtn" data-master="rate">Rate List</button></aside>
<main class="wrap" id="app"></main>
<div id="toast"></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwHRNE9vw17BDgUgVVOVdIyl4hFMtjBEzqxCkDUcB1ncER6WsLAADtAMrmeCB3IWmQr5g/exec';
const EMAIL_KEY='salon_user_email';
let email=localStorage.getItem(EMAIL_KEY)||'';
let current='employee', cache={};
const $=id=>document.getElementById(id);
function toast(m){$('toast').innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>{$('toast').innerHTML=''},2600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openDrawer(){ $('drawer').classList.add('open');$('shade').classList.add('open') }
function closeDrawer(){ $('drawer').classList.remove('open');$('shade').classList.remove('open') }
$('menuBtn').onclick=openDrawer;$('shade').onclick=closeDrawer;
function jsonp(url){return new Promise((resolve,reject)=>{const cb='masterCB_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{finish();reject(new Error('Request timed out.'))},15000);function finish(){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{finish();resolve(d)};s.onerror=()=>{finish();reject(new Error('Google Sheet could not be reached.'))};s.src=url+'&t='+Date.now()+'&callback='+cb;document.head.appendChild(s)})}
async function readMaster(master){
  const u=SCRIPT_URL+'?action=master&masterAction=read&master='+encodeURIComponent(master)+'&email='+encodeURIComponent(email);
  const r=await jsonp(u);if(!r.ok)throw new Error(r.message||'Read failed');return r;
}
function postMaster(masterAction,master,data,rowNumber){
  return new Promise((resolve,reject)=>{
    const frame=document.createElement('iframe');frame.name='masterSubmit_'+Date.now();frame.style.display='none';document.body.appendChild(frame);
    const f=document.createElement('form');f.method='POST';f.action=SCRIPT_URL;f.target=frame.name;f.style.display='none';
    const add=(n,v)=>{const i=document.createElement('input');i.name=n;i.value=v??'';f.appendChild(i)};
    add('action','master');add('masterAction',masterAction);add('master',master);add('email',email);if(rowNumber)add('rowNumber',rowNumber);if(data)add('data',JSON.stringify(data));
    document.body.appendChild(f);f.submit();
    setTimeout(()=>{frame.remove();f.remove();resolve(true)},1200);
  });
}
function field(v,cls=''){return '<input class="input '+cls+'" value="'+esc(v)+'">'}
function headersFor(master){
 if(master==='employee')return ['SR','Email address','Employee Name','Entry Access','Status','Expense Type','Counter Cash','Daily Expense','Salary','Master Access'];
 if(master==='expense_type')return ['SR','Expense Type','Status'];
 return ['Service Type','Amount'];
}
function employeeCell(h,v,row){
 if(h==='SR')return '<input class="input sr" value="'+esc(v)+'" inputmode="numeric">';
 if(h==='Status'||h==='Entry Access'||h==='Counter Cash'||h==='Daily Expense'||h==='Salary'||h==='Master Access'){
   const opts=h==='Entry Access'?['Self','All']:['Yes','No'];return '<select class="select">'+opts.map(x=>'<option '+(String(v).toLowerCase()===x.toLowerCase()?'selected':'')+'>'+x+'</option>').join('')+'</select>';
 }
 if(h==='Expense Type'){
   const selected=String(v||'').trim().toLowerCase()==='all'?['ALL']:String(v||'').split(/[,;\s]+/).filter(Boolean);
   const types=(cache.expense_type?.rows||[]).map(r=>String(r[0]||'').trim()).filter(Boolean);
   return '<div class="checks"><label class="check"><input type="checkbox" value="ALL" '+(selected.includes('ALL')?'checked':'')+'>All</label>'+types.map(sr=>'<label class="check"><input type="checkbox" value="'+esc(sr)+'" '+(selected.includes(sr)?'checked':'')+'>'+esc(sr)+'</label>').join('')+'</div>';
 }
 return field(v);
}
function render(){
 const h=headersFor(current), d=cache[current];
 $('app').innerHTML='<section class="card"><div class="head"><div><h1>'+({employee:'Employee List',expense_type:'Expense Type',rate:'Rate List'}[current])+'</h1><p>Edit existing rows directly or use the blank row at the bottom to add a new record.</p></div><div class="actions"><button class="btn secondary" id="refresh">↻ Refresh</button><button class="btn primary" id="addBlank">＋ Add Blank Row</button></div></div><div class="table-wrap"><table class="master-table"><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'<th>Action</th></tr></thead><tbody id="body"></tbody></table></div></section>';
 const body=$('body');const rows=d?.rows||[];
 rows.forEach((r,i)=>addRow(body,h,r,i+2,false));
 addRow(body,h,h.map(()=>''),rows.length+2,true);
 $('refresh').onclick=load;$('addBlank').onclick=()=>addRow(body,h,h.map(()=>''),body.querySelectorAll('tr').length+2,true);
}
function addRow(body,h,r,rowNumber,isNew){
 const tr=document.createElement('tr');tr.dataset.row=rowNumber;tr.dataset.new=isNew?'1':'0';
 h.forEach((x,i)=>{const td=document.createElement('td');td.innerHTML=current==='employee'?employeeCell(x,r[i]||'',rowNumber):field(r[i]||'');tr.appendChild(td)});
 const td=document.createElement('td');td.innerHTML='<div class="row-actions"><button class="iconbtn save" title="Save">💾</button>'+(isNew?'':'<button class="iconbtn del" title="Delete">🗑</button>')+'</div>';tr.appendChild(td);body.appendChild(tr);
 tr.querySelector('.save').onclick=()=>saveRow(tr,h,isNew);
 if(!isNew)tr.querySelector('.del').onclick=()=>deleteRow(tr.dataset.row);
}
function getRowData(tr,h){const data={};h.forEach((x,i)=>{const td=tr.children[i];if(current==='employee'&&x==='Expense Type'){data[x]=[...td.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value).filter(v=>v!=='ALL').join(',');if(td.querySelector('input[value=ALL]')?.checked)data[x]='All';}else{const el=td.querySelector('input,select');data[x]=el?el.value.trim():''}});data.rowNumber=Number(tr.dataset.row);return data}
async function saveRow(tr,h,isNew){try{
 const data=getRowData(tr,h);if(current==='employee'){if(!data['Employee Name'])return toast('Employee Name is required.');if(!data['Email address'])return toast('Email address is required.');if(!data['SR'])data['SR']=nextSR();}
 if(current==='expense_type'){if(!data['Expense Type'])return toast('Expense Type is required.');if(!data['SR'])data['SR']=nextSR();}
 await postMaster('save',current,data,isNew?0:data.rowNumber);toast('Saving...');await new Promise(r=>setTimeout(r,1300));await load();
}catch(e){toast(e.message)}}
function nextSR(){const rows=cache[current]?.rows||[];let m=0;rows.forEach(r=>{const n=Number(r[0]);if(Number.isFinite(n))m=Math.max(m,n)});return String(m+1)}
async function deleteRow(row){if(!confirm('Delete this row?'))return;try{await postMaster('delete',current,null,row);toast('Deleting...');await new Promise(r=>setTimeout(r,1300));await load()}catch(e){toast(e.message)}}
async function load(){if(!email){showLogin();return}$('userEmail').textContent=email;try{cache[current]=await readMaster(current);if(current==='employee'&&!cache.expense_type)cache.expense_type=await readMaster('expense_type');render()}catch(e){$('app').innerHTML='<section class="card"><div class="empty">'+esc(e.message)+'</div></section>'}}
function showLogin(){$('app').innerHTML='<section class="card login"><div class="head"><div><h1>Master Settings</h1><p>Enter the email already registered in Employee List.</p></div></div><div class="body"><label>Email address</label><input class="input" id="loginEmail" type="email" placeholder="name@example.com"><button class="btn primary" style="width:100%;margin-top:10px" id="loginBtn">Continue</button><div class="small" style="margin-top:10px">No browser prompt will be used.</div></div></section>';$('loginBtn').onclick=()=>{const v=$('loginEmail').value.trim().toLowerCase();if(!v)return toast('Enter email address.');email=v;localStorage.setItem(EMAIL_KEY,email);load()}}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=async()=>{current=b.dataset.master;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x===b));closeDrawer();await load()});
load();
</script>
</body></html>
