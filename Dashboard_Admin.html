<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOURS SALON — Master Settings</title>
<style>
:root{
  --teal:#18b7aa; --teal2:#0f9e94; --bg:#f5f7f9; --card:#fff; --text:#17212b;
  --muted:#74808b; --line:#e5eaee; --danger:#e25555; --shadow:0 8px 28px rgba(20,35,45,.08);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:20}
.menuBtn{width:42px;height:42px;border:0;background:#eefaf8;color:var(--teal2);border-radius:12px;font-size:22px;cursor:pointer}
.brand{margin-left:14px;font-weight:800;letter-spacing:.08em;font-size:18px}
.user{margin-left:auto;font-size:13px;color:var(--muted);max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{padding:26px;max-width:1450px;margin:auto}
.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}
.status{padding:9px 12px;border-radius:10px;background:#edf9f7;color:#148c83;font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.cardHead{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cardHead strong{font-size:16px}.count{color:var(--muted);font-size:12px}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:middle}
th{background:#fafbfc;color:#66727d;font-weight:800;position:sticky;top:0;z-index:1}
td input,td select{width:100%;min-width:70px;border:1px solid #dfe5e9;border-radius:8px;padding:8px;background:#fff;outline:none}
td input:focus,td select:focus{border-color:var(--teal)}
.actions{display:flex;gap:6px;white-space:nowrap}
.btn{border:0;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}
.save{background:var(--teal);color:#fff}.del{background:#fff0f0;color:var(--danger)}.add{background:#eafaf8;color:#118e85}
.drawer{position:fixed;inset:0;pointer-events:none;z-index:50}
.drawer:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;transition:.2s}
.panel{position:absolute;left:0;top:0;bottom:0;width:280px;background:#fff;box-shadow:14px 0 35px rgba(0,0,0,.12);transform:translateX(-105%);transition:.22s;padding:22px}
.drawer.open{pointer-events:auto}.drawer.open:before{opacity:1}.drawer.open .panel{transform:none}
.close{float:right;border:0;background:#f2f5f6;width:34px;height:34px;border-radius:9px;cursor:pointer}
.panel h2{margin:8px 0 22px;font-size:19px}
.navItem{width:100%;border:0;background:#fff;text-align:left;padding:13px 12px;border-radius:10px;cursor:pointer;margin:3px 0;font-weight:700;color:#34404a}
.navItem.active,.navItem:hover{background:#eafaf8;color:#108e85}
.login{max-width:440px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.login h2{margin-top:0}.login input{width:100%;padding:12px;border:1px solid #dfe5e9;border-radius:10px;margin:12px 0}
.toast{position:fixed;right:18px;bottom:18px;background:#18232b;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:700px){
 .top{padding:0 12px;height:60px}.brand{font-size:15px}.user{font-size:11px;max-width:38vw}
 .wrap{padding:15px 10px}.hero{align-items:center}h1{font-size:22px}.status{font-size:10px}
 .card{border-radius:14px}.cardHead{padding:14px}.panel{width:82vw;max-width:300px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer" class="drawer">
  <div class="panel">
    <button class="close" onclick="closeDrawer()">×</button>
    <h2>Master Settings</h2>
    <button class="navItem active" data-master="employee" onclick="openMaster('employee')">Employee List</button>
    <button class="navItem" data-master="expense_type" onclick="openMaster('expense_type')">Expense Type</button>
    <button class="navItem" data-master="rate" onclick="openMaster('rate')">Rate List</button>
  </div>
</div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwHRNE9vw17BDgUgVVOVdIyl4hFMtjBEzqxCkDUcB1ncER6WsLAADtAMrmeCB3IWmQr5g/exec';
const SHEET_ID='14Xdl0QXuXorhQBDxGSSGXu3fpQQzvBJGWRGjIlu5-Qo';
const STORAGE_KEYS=['salon_user_email','userEmail','googleEmail','email'];
let email=STORAGE_KEYS.map(k=>localStorage.getItem(k)).find(Boolean)||'';
let activeMaster='employee', cache={};

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),3000)}
function openDrawer(){document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function norm(s){return String(s??'').trim().toLowerCase()}

function jsonp(url,timeout=12000){
  return new Promise((resolve,reject)=>{
    const cb='salonMasterCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script'); let done=false;
    const cleanup=()=>{try{delete window[cb]}catch(e){};script.remove();clearTimeout(timer)}
    const fail=e=>{if(done)return;done=true;cleanup();reject(e instanceof Error?e:new Error(String(e)))};
    const timer=setTimeout(()=>fail(new Error('Request timed out.')),timeout);
    window[cb]=data=>{if(done)return;done=true;cleanup();resolve(data)};
    script.onerror=()=>fail(new Error('Apps Script could not be reached. Please redeploy Combined Master 4.'));
    const u=new URL(url);u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());
    script.src=u.toString();script.async=true;document.head.appendChild(script);
  });
}

function sheetJSONP(sheetName){
  return new Promise((resolve,reject)=>{
    const cb='gvizCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');let done=false;
    const cleanup=()=>{try{delete window[cb]}catch(e){};script.remove();clearTimeout(timer)}
    const fail=e=>{if(done)return;done=true;cleanup();reject(e instanceof Error?e:new Error(String(e)))};
    const timer=setTimeout(()=>fail(new Error('Google Sheet read timed out.')),12000);
    window[cb]=g=>{if(done)return;done=true;cleanup();if(!g||g.status==='error')return fail(new Error(g?.errors?.[0]?.detailed_message||g?.errors?.[0]?.message||'Google Sheet query failed.'));resolve(g)};
    script.onerror=()=>fail(new Error('Google Sheet could not be reached. Check Sheet sharing.'));
    const u=new URL('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq');
    u.searchParams.set('tqx','responseHandler:'+cb);u.searchParams.set('sheet',sheetName);u.searchParams.set('range','A:Z');u.searchParams.set('tq','select *');u.searchParams.set('_',Date.now());
    script.src=u.toString();script.async=true;document.head.appendChild(script);
  });
}

async function readSheet(sheetName){
  const g=await sheetJSONP(sheetName);
  const headers=(g.table?.cols||[]).map(c=>String(c.label||c.id||'').trim());
  const rows=(g.table?.rows||[]).map(r=>(r.c||[]).map(c=>c==null?'':(c.f??c.v??'')));
  return {headers,rows};
}

async function checkMasterAccess(){
  if(!email)return false;
  const d=await readSheet('Employee List');
  const h=d.headers.map(norm), ei=h.findIndex(x=>x==='email address'||x.includes('email')), mi=h.findIndex(x=>x==='master access'), si=h.findIndex(x=>x==='status');
  const row=d.rows.find(r=>norm(r[ei])===norm(email));
  if(!row)return false;
  return norm(row[si])==='active' && ['yes','y','true','1'].includes(norm(row[mi]));
}

function renderShell(){
  document.getElementById('app').innerHTML=`
  <header class="top">
    <button class="menuBtn" onclick="openDrawer()">☰</button>
    <div class="brand">YOURS SALON</div>
    <div class="user">${esc(email)}</div>
  </header>
  <main class="wrap">
    <div class="hero"><div><h1 id="title">Employee List</h1><div class="sub">Master data management</div></div><div id="status" class="status">Ready</div></div>
    <section class="card"><div class="cardHead"><strong id="cardTitle">Employee List</strong><span id="count" class="count"></span><button class="btn add" style="margin-left:auto" onclick="addBlank()">＋ Add Row</button></div><div id="table"></div></section>
  </main>`;
}

function field(master,h,v){
  const opts=['Status','Entry Access','Counter Cash','Daily Expense','Salary','Master Access'];
  if(opts.includes(h)) return `<select data-field="${esc(h)}"><option value="">Select</option><option ${norm(v)==='yes'?'selected':''}>Yes</option><option ${norm(v)==='no'?'selected':''}>No</option><option ${norm(v)==='all'?'selected':''}>All</option><option ${norm(v)==='self'?'selected':''}>Self</option><option ${norm(v)==='active'?'selected':''}>Active</option><option ${norm(v)==='inactive'?'selected':''}>Inactive</option></select>`;
  return `<input data-field="${esc(h)}" value="${esc(v)}">`;
}

function employeeExpenseCell(v){
  const activeTypes=(cache.expense_type?.rows||[]).map(r=>({sr:String(r[0]??'').trim(),name:String(r[1]??'').trim(),status:norm(r[2])})).filter(x=>x.name&&x.status==='active');
  const selected=norm(v)==='all'?new Set(['ALL']):new Set(String(v??'').split(/[,;\\s]+/).filter(Boolean));
  return `<div style="min-width:230px"><label style="display:block;font-size:11px;color:#667;margin-bottom:5px"><input type="checkbox" data-all ${selected.has('ALL')?'checked':''} onchange="toggleAll(this)"> All</label>${activeTypes.map(x=>`<label style="display:inline-flex;align-items:center;gap:4px;margin:2px 7px 2px 0;font-size:11px"><input type="checkbox" data-exp-sr="${esc(x.sr)}" ${selected.has(x.sr)?'checked':''}>${esc(x.sr)}. ${esc(x.name)}</label>`).join('')}</div>`;
}
function toggleAll(el){const row=el.closest('tr');row.querySelectorAll('[data-exp-sr]').forEach(x=>x.checked=el.checked)}

function currentRowData(tr,master){
  const data={};
  tr.querySelectorAll('[data-field]').forEach(el=>data[el.dataset.field]=el.value);
  if(master==='employee'){
    const all=tr.querySelector('[data-all]')?.checked;
    data['Expense Type']=all?'All':[...tr.querySelectorAll('[data-exp-sr]:checked')].map(x=>x.dataset.expSr).join(', ');
  }
  return data;
}

function renderTable(master,headers,rows){
  cache[master]={headers,rows};
  let hs=headers;
  if(!hs.length) hs=master==='rate'?['Service Type','Amount']:master==='expense_type'?['SR','Expense Type','Status']:['SR','Email address','Employee Name','Entry Access','Status','Expense Type','Counter Cash','Daily Expense','Salary','Master Access'];
  const body=rows.map(r=>`<tr data-row="${r.rowNumber}">${hs.map(h=>{
    const v=r[h]??'';
    if(master==='employee'&&h==='Expense Type') return `<td>${employeeExpenseCell(v)}</td>`;
    return `<td>${field(master,h,v)}</td>`;
  }).join('')}<td class="actions"><button class="btn save" onclick="saveExisting(this)">Save</button><button class="btn del" onclick="deleteRow(this)">Delete</button></td></tr>`).join('');
  const head=hs.map(h=>`<th>${esc(h)}</th>`).join('')+'<th>Action</th>';
  document.getElementById('table').innerHTML=`<div class="tableWrap"><table><thead><tr>${head}</tr></thead><tbody>${body||'<tr><td colspan="99" class="empty">No records found.</td></tr>'}</tbody></table></div>`;
  document.getElementById('count').textContent=`${rows.length} records`;
}

async function openMaster(master){
  activeMaster=master;closeDrawer();
  document.querySelectorAll('.navItem').forEach(x=>x.classList.toggle('active',x.dataset.master===master));
  const title=master==='employee'?'Employee List':master==='expense_type'?'Expense Type':'Rate List';
  document.getElementById('title').textContent=title;document.getElementById('cardTitle').textContent=title;document.getElementById('status').textContent='Loading…';
  try{
    const d=await readSheet(title);
    cache[master]={headers:d.headers,rows:d.rows};
    if(master==='expense_type') cache.expense_type=d;
    if(master==='employee'){
      // Load Expense Type options separately for the multi-select.
      cache.expense_type=await readSheet('Expense Type');
    }
    const rows=d.rows.map((r,i)=>{const o={rowNumber:i+2};d.headers.forEach((h,j)=>o[h]=r[j]??'');return o}).filter(o=>Object.keys(o).some(k=>k!=='rowNumber'&&String(o[k]).trim()!==''));
    renderTable(master,d.headers,rows);document.getElementById('status').textContent='Connected';
  }catch(e){document.getElementById('status').textContent='Error';document.getElementById('table').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

function addBlank(){
  const tbody=document.querySelector('tbody');if(!tbody)return;
  const hs=cache[activeMaster]?.headers?.length?cache[activeMaster].headers:(activeMaster==='rate'?['Service Type','Amount']:activeMaster==='expense_type'?['SR','Expense Type','Status']:['SR','Email address','Employee Name','Entry Access','Status','Expense Type','Counter Cash','Daily Expense','Salary','Master Access']);
  const tr=document.createElement('tr');tr.dataset.row='0';
  hs.forEach(h=>{const td=document.createElement('td');td.innerHTML=activeMaster==='employee'&&h==='Expense Type'?employeeExpenseCell(''):field(activeMaster,h,'');tr.appendChild(td)});
  const td=document.createElement('td');td.className='actions';td.innerHTML='<button class="btn save" onclick="saveExisting(this)">Save</button>';tr.appendChild(td);tbody.appendChild(tr);tr.scrollIntoView({behavior:'smooth',block:'center'});
}
async function masterWrite(action,tr){
  const rowNumber=Number(tr.dataset.row||0), data=currentRowData(tr,activeMaster);
  const url=new URL(SCRIPT_URL);url.searchParams.set('action','master');url.searchParams.set('masterAction',action);url.searchParams.set('master',activeMaster);url.searchParams.set('email',email);url.searchParams.set('rowNumber',rowNumber);if(action==='save')url.searchParams.set('data',JSON.stringify(data));
  const res=await jsonp(url.toString(),15000);if(!res?.ok)throw new Error(res?.message||'Master operation failed.');return res;
}
async function saveExisting(btn){
  const tr=btn.closest('tr');btn.disabled=true;
  try{await masterWrite('save',tr);toast('Saved successfully');await openMaster(activeMaster)}
  catch(e){toast(e.message)}finally{btn.disabled=false}
}
async function deleteRow(btn){
  const tr=btn.closest('tr');if(!tr.dataset.row||tr.dataset.row==='0'){tr.remove();return}
  if(!confirm('Delete this row?'))return;btn.disabled=true;
  try{await masterWrite('delete',tr);toast('Deleted successfully');await openMaster(activeMaster)}
  catch(e){toast(e.message)}finally{btn.disabled=false}
}

async function boot(){
  if(!email){
    document.getElementById('app').innerHTML=`<div class="login"><h2>Master Settings</h2><div class="sub">Enter the email used in Employee List.</div><input id="emailInput" placeholder="Email address"><button class="btn save" style="width:100%" onclick="setEmail()">Continue</button></div>`;return;
  }
  renderShell();
  try{
    const ok=await checkMasterAccess();
    if(!ok) throw new Error('Master Settings access not allowed for this account.');
    await openMaster('employee');
  }catch(e){
    document.getElementById('table').innerHTML=`<div class="empty">${esc(e.message)}<br><br><small>${esc(email)}</small></div>`;
    document.getElementById('status').textContent='Access denied';
  }
}
function setEmail(){const v=document.getElementById('emailInput').value.trim().toLowerCase();if(!v)return;localStorage.setItem('salon_user_email',v);email=v;boot()}
boot();
</script>
</body>
</html>
