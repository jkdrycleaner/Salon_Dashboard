<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOURS SALON — Add Expense</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{background:#12100E;color:#F3EEE3;font-family:Arial,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
.container{background:#1B1815;border:1px solid #332C22;border-radius:12px;padding:24px;max-width:480px;width:100%}
.logo{font-size:24px;font-weight:700;color:#C9A227;margin-bottom:10px;border-bottom:1px solid #332C22;padding-bottom:10px}
.logo span{color:#E4C55C}
h2{font-size:20px;margin-bottom:3px}
.sub{color:#9C9284;font-size:12px;margin-bottom:10px}
.login-box{position:relative;min-height:42px;margin-bottom:9px}
.google-btn{margin-top:0!important;background:#F3EEE3!important;color:#1B1815!important;border:1px solid #CFC7B8!important}
.btn{width:100%;height:40px;background:#C9A227;color:#1B1508;border:0;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:3px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.dashboard-btn{margin-top:7px;background:#332C22;color:#F3EEE3}
#userEmail{display:none}
#userEmail.authenticated{position:absolute;top:0;right:0;width:30px;height:30px;display:flex!important;align-items:center;justify-content:center;color:#C9A227;font-size:19px;cursor:help}
#userEmail.authenticated::after{content:attr(data-email);position:fixed;top:10px;right:14px;max-width:230px;color:#9C9284;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#expenseForm{display:none}
.stepper{display:flex;align-items:center;gap:7px;margin:4px 0 12px}
.step{height:6px;flex:1;border-radius:10px;background:#332C22}
.step.active,.step.done{background:#C9A227}
.page{display:none}
.page.active{display:block}
.page-title{font-size:14px;font-weight:700;margin-bottom:8px}
.page-note{font-size:10px;color:#9C9284;margin-bottom:8px}
.email-card{background:#242019;border:1px solid #332C22;border-radius:8px;padding:8px 10px;font-size:10px;color:#9C9284;margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email-card strong{color:#C9A227;font-weight:600}
.field-label{font-size:9px;color:#9C9284;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.required-star{color:#C9A227}
.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.option-card{width:100%;min-height:44px;background:#242019;border:1px solid #332C22;border-radius:9px;color:#F3EEE3;padding:9px 10px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:.15s}
.option-card:hover{border-color:#8E7525}
.option-card.selected{border-color:#C9A227;background:rgba(201,162,39,.12);color:#E4C55C;box-shadow:inset 0 0 0 1px rgba(201,162,39,.18)}
.option-card small{display:block;color:#9C9284;font-size:9px;font-weight:400;margin-top:3px}
.auto-card{cursor:default}
.salary-box{display:block;margin-top:9px}
.salary-box.disabled .month-grid{opacity:.45;pointer-events:none}
.month-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.month-card{min-height:42px;font-size:11px}
.type-hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:9px}
.type-hero .option-card{min-height:52px}
.type-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;overflow:hidden;max-height:500px;transition:max-height .2s,opacity .2s}
.type-list.hidden{max-height:0;opacity:0;pointer-events:none}
.show-more{border:0;background:none;color:#9C9284;font-size:10px;cursor:pointer;width:100%;padding:7px 0}
.form-input,.form-textarea{width:100%;background:#242019;border:1px solid #332C22;border-radius:8px;color:#F3EEE3;outline:none;padding:9px 10px;font-size:14px}
.form-input{height:40px}
.form-textarea{height:70px;resize:none}
.form-input:focus,.form-textarea:focus{border-color:#C9A227}
.form-input::placeholder,.form-textarea::placeholder{color:#5A5042}
.field-block{margin-top:9px}
.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.nav-row.single{grid-template-columns:1fr}
.back-btn{background:#332C22;color:#F3EEE3}
#status{margin-top:7px;padding:8px 10px;border-radius:7px;font-size:11px;display:none}
#status.success{display:block;background:rgba(62,130,114,.2);border:1px solid #3E8272;color:#8FD4C4}
#status.error{display:block;background:rgba(181,71,63,.2);border:1px solid #B5473F;color:#E88A82}
#status.loading{display:block;background:rgba(201,162,39,.05);border:1px solid #332C22;color:#9C9284}
@media(max-width:600px){
html,body{height:100%;min-height:100%;overflow:hidden}
body{padding:0;align-items:stretch;justify-content:stretch}
.container{width:100%;max-width:none;height:100dvh;min-height:100dvh;border:0;border-radius:0;padding:14px 18px 12px;overflow:auto}
.logo{font-size:21px;margin-bottom:7px;padding-bottom:7px}
h2{font-size:18px}.sub{font-size:10px;margin-bottom:8px}
.stepper{margin-bottom:10px}.option-card{min-height:45px;padding:9px 8px;font-size:12px}
.type-hero .option-card{min-height:50px}.form-input{height:40px;font-size:13px}
.form-textarea{height:65px;font-size:13px}.btn{height:39px;font-size:12px}
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">YOURS <span>SALON</span></div>
  <h2>💰 Add Expense</h2>
  <div class="sub">Choose details step by step</div>

  <div class="login-box">
    <button type="button" class="btn google-btn" id="googleSignInBtn">Continue with Google</button>
    <div id="userEmail"></div>
  </div>

  <form id="expenseForm">
    <div class="stepper">
      <span class="step active" id="stepDot1"></span>
      <span class="step" id="stepDot2"></span>
      <span class="step" id="stepDot3"></span>
    </div>

    <section class="page active" id="page1">
      <div class="page-title">1. Select Name</div>
      <div class="email-card">Signed in as <strong id="emailDisplay"></strong></div>

      <div id="nameAutoGroup" style="display:none">
        <div class="field-label">Name</div>
        <button type="button" class="option-card selected auto-card" id="autoNameCard"></button>
      </div>

      <div id="nameSelectGroup">
        <div class="field-label">Name <span class="required-star">*</span></div>
        <div class="card-grid" id="nameCards"></div>
      </div>

      <div class="salary-box disabled" id="salaryMonthBox">
        <div class="field-label">Salary Month <span class="required-star" id="salaryRequiredStar" style="display:none">*</span></div>
        <div class="month-grid" id="salaryMonthCards"></div>
      </div>

      <div class="nav-row single">
        <button type="button" class="btn" id="next1">Next →</button>
      </div>
    </section>

    <section class="page" id="page2">
      <div class="page-title">2. Select Expense Type</div>
      <div class="page-note">Salary aur Shop Expense quick header cards hain.</div>

      <div class="type-hero">
        <button type="button" class="option-card" data-type="Salary">💰 Salary<small>Staff salary</small></button>
        <button type="button" class="option-card" data-type="Shop Expense">🏪 Shop Expense<small>Shop related</small></button>
      </div>

      <div class="field-label">Other Expense Types</div>
      <div class="type-list" id="typeList"></div>
      <button type="button" class="show-more" id="showTypesBtn">Hide other types ↑</button>

      <div class="nav-row">
        <button type="button" class="btn back-btn" id="back2">← Back</button>
        <button type="button" class="btn" id="next2">Next →</button>
      </div>
    </section>

    <section class="page" id="page3">
      <div class="page-title">3. Payment & Details</div>

      <div class="field-block" style="margin-top:0">
        <div class="field-label">Payment Mode <span class="required-star">*</span></div>
        <div class="card-grid" id="paymentCards"></div>
      </div>

      <div class="field-block">
        <div class="field-label">Amount (₹) <span class="required-star">*</span></div>
        <input class="form-input" type="number" id="amount" placeholder="0" min="1" step="1" inputmode="numeric" required>
      </div>

      <div class="field-block">
        <div class="field-label">Remark</div>
        <textarea class="form-textarea" id="remark" placeholder="Enter remark"></textarea>
      </div>

      <div class="nav-row">
        <button type="button" class="btn back-btn" id="back3">← Back</button>
        <button type="submit" class="btn" id="submitBtn">Save Expense</button>
      </div>
      <button type="button" class="btn dashboard-btn" id="dashboardBtn">Dashboard</button>
    </section>
  </form>

  <div id="status"></div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwHRNE9vw17BDgUgVVOVdIyl4hFMtjBEzqxCkDUuB1ncER6WsLAADtAMrmeCB3IWmQr5g/exec';
const DASHBOARD_URL='https://jkdrycleaner.github.io/Salon_Dashboard/';
const GOOGLE_CLIENT_ID='326263063666-ndmfvf4eidtvdkr5imc19din2evqbinv.apps.googleusercontent.com';
const STORAGE_CREDENTIAL='salon_google_credential';
const STORAGE_EMAIL='salon_user_email';

const EMAIL_NAME_MAP={
  'ashukumar12211551@gmail.com':'Ashu Kumar',
  'aamir839398058@gmail.com':'Amir Khan',
  's45351520@gmail.com':'Suhail Khan'
};

const ALL_NAMES=['Ashu Kumar','Amir Khan','Suhail Khan','Jaan Mohd','Shop','Home'];

const EXPENSE_TYPES=[
  'Salary','Advance','Daily Expense','Counter Cash','Shop Expense',
  'Home Expense','Home','Rent','EMI','Car'
];

const PAYMENT_MODES=['Cash','Online'];

let googleCredential=null,userEmail='',userName='',isAuthenticated=false,isSubmitting=false;
let currentPage=1,selectedName='',selectedExpenseType='',selectedPaymentMode='Cash',selectedSalaryMonth='';

function safeStorageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeStorageSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function safeStorageRemove(k){try{localStorage.removeItem(k)}catch(e){}}

function showStatus(m,t){
  const s=document.getElementById('status');
  if(!s)return;
  s.textContent=m;s.className=t;s.style.display='block';
}
function hideStatus(){
  const s=document.getElementById('status');
  if(!s)return;
  s.textContent='';s.className='';s.style.display='none';
}
function esc(s){
  return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function renderNameCards(){
  const wrap=document.getElementById('nameCards');
  if(!wrap)return;
  wrap.innerHTML=ALL_NAMES.map(n =>
    '<button type="button" class="option-card '+(selectedName===n?'selected':'')+'" data-name="'+esc(n)+'">'+esc(n)+'</button>'
  ).join('');
  wrap.querySelectorAll('[data-name]').forEach(b=>{
    b.addEventListener('click',()=>{
      selectedName=b.dataset.name;
      renderNameCards();
    });
  });
}

function getSalaryMonths(){
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now=new Date();
  const result=[];
  for(let offset=2;offset>=0;offset--){
    const d=new Date(now.getFullYear(),now.getMonth()-offset,1);
    result.push(months[d.getMonth()]+' '+d.getFullYear());
  }
  return [...new Set(result)];
}

function renderSalaryMonths(){
  const wrap=document.getElementById('salaryMonthCards');
  if(!wrap)return;
  wrap.innerHTML=getSalaryMonths().map(v =>
    '<button type="button" class="option-card month-card '+(selectedSalaryMonth===v?'selected':'')+'" data-month="'+esc(v)+'">'+esc(v)+'</button>'
  ).join('');
  wrap.querySelectorAll('[data-month]').forEach(b=>{
    b.addEventListener('click',()=>{
      selectedSalaryMonth=b.dataset.month;
      renderSalaryMonths();
    });
  });
}

function updateSalaryUI(){
  const box=document.getElementById('salaryMonthBox');
  const star=document.getElementById('salaryRequiredStar');
  const active=selectedExpenseType==='Salary';
  box.classList.toggle('disabled',!active);
  star.style.display=active?'inline':'none';
  renderSalaryMonths();
}

function renderExpenseTypes(){
  const list=document.getElementById('typeList');
  if(!list)return;
  const types=[...new Set(EXPENSE_TYPES)].filter(t=>t!=='Salary'&&t!=='Shop Expense');
  list.innerHTML=types.map(t =>
    '<button type="button" class="option-card" data-type="'+esc(t)+'">'+esc(t)+'</button>'
  ).join('');
  document.querySelectorAll('[data-type]').forEach(b=>{
    b.addEventListener('click',()=>selectExpenseType(b.dataset.type));
  });
}

function selectExpenseType(type){
  if(!EXPENSE_TYPES.includes(type))return;
  selectedExpenseType=type;

  document.querySelectorAll('[data-type]').forEach(b=>{
    b.classList.toggle('selected',b.dataset.type===type);
  });

  if(type==='Salary'||type==='Shop Expense'){
    document.getElementById('typeList').classList.add('hidden');
    document.getElementById('showTypesBtn').textContent='Show other types ↓';
  }else{
    document.getElementById('typeList').classList.remove('hidden');
    document.getElementById('showTypesBtn').textContent='Hide other types ↑';
  }

  updateSalaryUI();
}

function renderPayment(){
  const wrap=document.getElementById('paymentCards');
  if(!wrap)return;
  wrap.innerHTML=[...new Set(PAYMENT_MODES)].map(v =>
    '<button type="button" class="option-card '+(selectedPaymentMode===v?'selected':'')+'" data-payment="'+esc(v)+'">'+(v==='Cash'?'💵 ':'📱 ')+esc(v)+'</button>'
  ).join('');
  wrap.querySelectorAll('[data-payment]').forEach(b=>{
    b.addEventListener('click',()=>{
      selectedPaymentMode=b.dataset.payment;
      renderPayment();
    });
  });
}

function goPage(n){
  currentPage=n;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page'+n);
  if(page)page.classList.add('active');

  for(let i=1;i<=3;i++){
    const dot=document.getElementById('stepDot'+i);
    if(dot)dot.className='step '+(i===n?'active':i<n?'done':'');
  }
  hideStatus();
  window.scrollTo(0,0);
}

function updateUIAfterLogin(){
  // FIX: Card-stepper layout has no #email input.
  // The old code tried to set document.getElementById('email').value and caused:
  // "Cannot set properties of null (setting 'value')".
  const emailDisplay=document.getElementById('emailDisplay');
  if(emailDisplay)emailDisplay.textContent=userEmail;

  const isMapped=Object.prototype.hasOwnProperty.call(EMAIL_NAME_MAP,userEmail);

  if(isMapped){
    userName=EMAIL_NAME_MAP[userEmail];
    selectedName=userName;
    const autoGroup=document.getElementById('nameAutoGroup');
    const selectGroup=document.getElementById('nameSelectGroup');
    const autoCard=document.getElementById('autoNameCard');
    if(autoGroup)autoGroup.style.display='block';
    if(selectGroup)selectGroup.style.display='none';
    if(autoCard)autoCard.textContent=userName;
  }else{
    selectedName='';
    const autoGroup=document.getElementById('nameAutoGroup');
    const selectGroup=document.getElementById('nameSelectGroup');
    if(autoGroup)autoGroup.style.display='none';
    if(selectGroup)selectGroup.style.display='block';
    renderNameCards();
  }

  const e=document.getElementById('userEmail');
  if(e){
    e.textContent='✉';
    e.title=userEmail;
    e.dataset.email=userEmail;
    e.className='authenticated';
  }

  const loginBtn=document.getElementById('googleSignInBtn');
  if(loginBtn)loginBtn.style.display='none';

  const form=document.getElementById('expenseForm');
  if(form)form.style.display='block';

  goPage(1);
}

function checkExistingSession(){
  const c=safeStorageGet(STORAGE_CREDENTIAL);
  const e=safeStorageGet(STORAGE_EMAIL);
  if(c&&e){
    const normalized=e.toLowerCase().trim();
    if(normalized){
      googleCredential=c;
      userEmail=normalized;
      userName=EMAIL_NAME_MAP[normalized]||'';
      isAuthenticated=true;
      updateUIAfterLogin();
    }
  }
}

function getRedirectUri(){
  return 'https://jkdrycleaner.github.io/Salon_Dashboard/Expenses.html';
}

function randomString(length=32){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out='';
  const bytes=new Uint8Array(length);
  crypto.getRandomValues(bytes);
  for(let i=0;i<length;i++)out+=chars[bytes[i]%chars.length];
  return out;
}

async function startGoogleLogin(){
  try{
    const state=randomString();
    safeStorageSet('salon_expense_oauth_state',state);

    const params=new URLSearchParams({
      client_id:GOOGLE_CLIENT_ID,
      redirect_uri:getRedirectUri(),
      response_type:'token',
      scope:'openid email profile',
      state:state,
      include_granted_scopes:'true',
      prompt:'select_account'
    });

    showStatus('Opening Google Sign-In...','loading');
    window.location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+params.toString());
  }catch(e){
    showStatus('Google Sign-In could not be started. Please try again.','error');
  }
}

async function handleOAuthReturn(){
  const hash=location.hash?location.hash.substring(1):'';
  if(!hash)return;

  const p=new URLSearchParams(hash);
  const error=p.get('error');
  const accessToken=p.get('access_token');
  const returnedState=p.get('state');
  const savedState=safeStorageGet('salon_expense_oauth_state');

  history.replaceState(null,document.title,location.pathname+location.search);

  if(error){
    safeStorageRemove('salon_expense_oauth_state');
    showStatus('Google Sign-In was cancelled or denied.','error');
    return;
  }
  if(!accessToken){
    showStatus('Google Sign-In did not return an account. Please try again.','error');
    return;
  }
  if(savedState&&returnedState&&savedState!==returnedState){
    showStatus('Google verification failed. Please try again.','error');
    return;
  }

  try{
    showStatus('Verifying Google account...','loading');

    const r=await fetch('https://openidconnect.googleapis.com/v1/userinfo',{
      headers:{Authorization:'Bearer '+accessToken}
    });

    if(!r.ok)throw new Error('Google account verification failed.');

    const info=await r.json();
    const normalized=(info.email||'').toLowerCase().trim();

    if(!normalized)throw new Error('Google email could not be read.');

    googleCredential=accessToken;
    userEmail=normalized;
    userName=EMAIL_NAME_MAP[normalized]||'';
    isAuthenticated=true;

    safeStorageSet(STORAGE_CREDENTIAL,googleCredential);
    safeStorageSet(STORAGE_EMAIL,userEmail);
    safeStorageRemove('salon_expense_oauth_state');

    updateUIAfterLogin();
    hideStatus();
  }catch(e){
    googleCredential=null;
    userEmail='';
    userName='';
    isAuthenticated=false;
    safeStorageRemove(STORAGE_CREDENTIAL);
    safeStorageRemove(STORAGE_EMAIL);
    showStatus(e.message||'Google account verification failed.','error');
  }
}

async function sendExpenseToSheet(d){
  const f=new URLSearchParams();
  f.append('action','expense');
  f.append('email',d.email);
  f.append('name',d.name);
  f.append('expenseType',d.expenseType);
  f.append('paymentMode',d.paymentMode);
  f.append('amount',d.amount);
  f.append('salaryMonth',d.salaryMonth||'');
  f.append('remark',d.remark);
  f.append('credential',googleCredential);

  await fetch(SCRIPT_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
    body:f.toString()
  });
  return true;
}

renderNameCards();
renderSalaryMonths();
renderExpenseTypes();
renderPayment();
updateSalaryUI();

document.getElementById('next1').addEventListener('click',()=>{
  if(!selectedName){
    showStatus('Please select Name.','error');
    return;
  }
  goPage(2);
});

document.getElementById('back2').addEventListener('click',()=>goPage(1));

document.getElementById('next2').addEventListener('click',()=>{
  if(!selectedExpenseType){
    showStatus('Please select Expense Type.','error');
    return;
  }
  if(selectedExpenseType==='Salary'&&!selectedSalaryMonth){
    goPage(1);
    showStatus('Salary select hai, pehle Salary Month choose karein.','error');
    return;
  }
  goPage(3);
});

document.getElementById('back3').addEventListener('click',()=>goPage(2));
document.getElementById('googleSignInBtn').addEventListener('click',startGoogleLogin);

document.getElementById('showTypesBtn').addEventListener('click',()=>{
  const list=document.getElementById('typeList');
  const hidden=list.classList.toggle('hidden');
  document.getElementById('showTypesBtn').textContent=hidden?'Show other types ↓':'Hide other types ↑';
});

document.getElementById('dashboardBtn').addEventListener('click',()=>location.href=DASHBOARD_URL);

document.getElementById('expenseForm').addEventListener('submit',async function(ev){
  ev.preventDefault();
  if(isSubmitting)return;
  hideStatus();

  if(!googleCredential||!isAuthenticated){
    showStatus('Please sign in with Google first.','error');
    return;
  }

  const finalName=EMAIL_NAME_MAP[userEmail]||selectedName;
  const amount=parseFloat(document.getElementById('amount').value)||0;
  const remark=document.getElementById('remark').value.trim();

  if(!finalName){
    goPage(1);
    showStatus('Please select Name.','error');
    return;
  }
  if(!selectedExpenseType){
    goPage(2);
    showStatus('Please select Expense Type.','error');
    return;
  }
  if(selectedExpenseType==='Salary'&&!selectedSalaryMonth){
    goPage(1);
    showStatus('Please select Salary Month.','error');
    return;
  }
  if(amount<=0){
    showStatus('Please enter a valid amount.','error');
    return;
  }

  isSubmitting=true;
  const b=document.getElementById('submitBtn');
  b.disabled=true;
  b.textContent='Saving...';
  showStatus('Saving expense...','loading');

  try{
    await sendExpenseToSheet({
      email:userEmail,
      name:finalName,
      expenseType:selectedExpenseType,
      paymentMode:selectedPaymentMode,
      amount:amount,
      salaryMonth:selectedSalaryMonth,
      remark:remark
    });

    document.getElementById('amount').value='';
    document.getElementById('remark').value='';
    selectedExpenseType='';
    selectedSalaryMonth='';
    selectedPaymentMode='Cash';

    document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('selected'));
    document.getElementById('typeList').classList.remove('hidden');
    document.getElementById('showTypesBtn').textContent='Hide other types ↑';

    renderPayment();
    updateSalaryUI();
    goPage(1);

    showStatus('Expense saved successfully. Ready for new expense.','success');
    setTimeout(hideStatus,2500);
  }catch(e){
    showStatus('Failed to save: '+e.message,'error');
  }

  isSubmitting=false;
  b.disabled=false;
  b.textContent='Save Expense';
});

window.addEventListener('load',async()=>{
  await handleOAuthReturn();
  checkExistingSession();
});
</script>
