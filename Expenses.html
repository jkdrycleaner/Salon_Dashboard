<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YOURS SALON — Expenses</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{background:#12100E;color:#F3EEE3;font-family:Arial,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
.container{background:#1B1815;border:1px solid #332C22;border-radius:12px;padding:24px;max-width:480px;width:100%}
.logo{font-size:24px;font-weight:700;color:#C9A227;margin-bottom:18px;border-bottom:1px solid #332C22;padding-bottom:12px}
.logo span{color:#E4C55C}
h2{font-size:20px;margin-bottom:3px}.sub{color:#9C9284;font-size:12px;margin-bottom:12px}
.login-box{position:relative;margin:0 0 10px;min-height:44px}
#userEmail{display:none}
#userEmail.authenticated{position:absolute;top:-2px;right:0;width:30px;height:30px;display:flex!important;align-items:center;justify-content:center;color:#C9A227;font-size:19px;cursor:help}
#userEmail.authenticated::after{content:attr(data-email);position:fixed;top:10px;right:14px;max-width:230px;color:#9C9284;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#expenseForm{display:none}.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:9px;color:#9C9284;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:#242019;border:1px solid #332C22;border-radius:8px;padding:7px 11px;color:#F3EEE3;font-size:14px;outline:none}
.form-group input,.form-group select{height:38px}.form-group textarea{height:72px;resize:none;font-family:Arial,sans-serif}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#C9A227}
.form-group input::placeholder,.form-group textarea::placeholder{color:#5A5042}
.form-group input:disabled{opacity:.8;color:#E4C55C}
.btn{width:100%;height:40px;background:#C9A227;color:#1B1508;border:0;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:3px}
.btn:disabled{opacity:.55;cursor:not-allowed}.google-btn{margin-top:0;background:#F3EEE3;color:#1B1815;border:1px solid #CFC7B8}
.dashboard-btn{margin-top:7px;background:#332C22;color:#F3EEE3}
#status{margin-top:7px;padding:8px 10px;border-radius:7px;font-size:11px;display:none}
#status.success{display:block;background:rgba(62,130,114,.2);border:1px solid #3E8272;color:#8FD4C4}
#status.error{display:block;background:rgba(181,71,63,.2);border:1px solid #B5473F;color:#E88A82}
#status.loading{display:block;background:rgba(201,162,39,.05);border:1px solid #332C22;color:#9C9284}
@media(max-width:600px){
html,body{height:100%;min-height:100%;overflow:hidden}body{padding:0;align-items:stretch;justify-content:stretch}
.container{width:100%;max-width:none;height:100dvh;min-height:100dvh;border:0;border-radius:0;padding:14px 18px 12px;overflow:hidden}
.logo{font-size:21px;margin-bottom:10px;padding-bottom:8px}h2{font-size:18px}.sub{font-size:10px;margin-bottom:9px}
.login-box{min-height:42px;margin-bottom:7px}.form-group{margin-bottom:7px}.form-group label{font-size:8px;margin-bottom:3px}
.form-group input,.form-group select{height:35px;min-height:35px;padding:6px 10px;font-size:13px}
.form-group textarea{height:58px;font-size:13px}.btn{height:38px;min-height:38px;font-size:13px}}
@media(max-width:600px) and (max-height:700px){
.container{padding-top:9px;padding-bottom:7px}.logo{margin-bottom:7px;padding-bottom:6px}.sub{margin-bottom:6px}.form-group{margin-bottom:5px}
.form-group input,.form-group select{height:31px;min-height:31px;font-size:12px}.form-group textarea{height:50px;font-size:12px}.btn{height:34px;min-height:34px}}
</style>
</head>
<body>
<div class="container">
<div class="logo">YOURS <span>SALON</span></div>
<h2>💰 Add Expense</h2>
<div class="sub">Sign in to add expense details</div>
<div class="login-box">
<button type="button" class="btn google-btn" id="googleSignInBtn">Continue with Google</button>
<div id="userEmail"></div>
</div>

<form id="expenseForm">
<div class="form-group"><label>Email Address</label><input type="email" id="email" disabled></div>
<div class="form-group" id="nameAutoGroup"><label>Name</label><input type="text" id="name" disabled></div>
<div class="form-group" id="nameSelectGroup" style="display:none"><label>Name</label>
<select id="nameSelect"></select></div>
<div class="form-group"><label>Expense Type</label>
<select id="expenseType" required>
<option value="">Select Expense Type</option>
<option>Salary</option><option>Advance</option><option>Daily Expense</option><option>Counter Cash</option><option>Shop Expense</option><option>Home Expense</option><option>Home</option><option>Rent</option><option>EMI</option><option>Car</option>
</select></div>
<div class="form-group"><label>Payment Mode</label><select id="paymentMode" required><option>Cash</option><option>Online</option></select></div>
<div class="form-group"><label>Amount (₹)</label><input type="number" id="amount" placeholder="0" min="1" step="1" inputmode="numeric" required></div>
<div class="form-group" id="salaryMonthGroup" style="display:none">
<label>Salary Month</label>
<select id="salaryMonth"></select>
</div>
<div class="form-group"><label>Remark</label><textarea id="remark" placeholder="Enter remark"></textarea></div>
<button type="submit" class="btn" id="submitBtn">Save and New Expense</button>
<button type="button" class="btn dashboard-btn" id="dashboardBtn">Dashboard</button>
</form>
<div id="status"></div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwHRNE9vw17BDgUgVVOVdIyl4hFMtjBEzqxCkDUuB1ncER6WsLAADtAMrmeCB3IWmQr5g/exec';
const DASHBOARD_URL='https://jkdrycleaner.github.io/Salon_Dashboard/';
const GOOGLE_CLIENT_ID='326263063666-ndmfvf4eidtvdkr5imc19din2evqbinv.apps.googleusercontent.com';
const STORAGE_CREDENTIAL='salon_google_credential';
const STORAGE_EMAIL='salon_user_email';

const EMAIL_NAME_MAP={
'ashukumar12211551@gmail.com':'Ashu Kumar',
'aamir839398058@gmail.com':'Amir Khan',
's45351520@gmail.com':'Suhail Khan'
};

const ADMIN_EMAILS=[
'jk2811524@gmail.com',
'write2javedkassar@gmail.com',
'yourssalooon@gmail.com',
'janubro007@gmail.com'
];

const ALL_NAMES=[
'Ashu Kumar',
'Amir Khan',
'Suhail Khan',
'Jaan Mohd',
'Shop',
'Home'
];

let googleCredential=null,userEmail='',userName='',isAuthenticated=false,isSubmitting=false;

function safeStorageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeStorageSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function safeStorageRemove(k){try{localStorage.removeItem(k)}catch(e){}}
function showStatus(m,t){const s=document.getElementById('status');s.textContent=m;s.className=t;s.style.display='block'}
function hideStatus(){const s=document.getElementById('status');s.textContent='';s.className='';s.style.display='none'}

function updateUIAfterLogin(){
document.getElementById('email').value=userEmail;
const isMapped=!!EMAIL_NAME_MAP[userEmail];

if(!isMapped){
document.getElementById('nameAutoGroup').style.display='none';
document.getElementById('nameSelectGroup').style.display='block';
const sel=document.getElementById('nameSelect');
sel.innerHTML='<option value="">Select Name</option>'+ALL_NAMES.map(n=>'<option value="'+n+'">'+n+'</option>').join('');
}else{
document.getElementById('nameAutoGroup').style.display='block';
document.getElementById('nameSelectGroup').style.display='none';
document.getElementById('name').value=userName;
}

const e=document.getElementById('userEmail');e.textContent='✉';e.title=userEmail;e.dataset.email=userEmail;e.className='authenticated';
document.getElementById('googleSignInBtn').style.display='none';
document.getElementById('expenseForm').style.display='block';
}

function checkExistingSession(){
const c=safeStorageGet(STORAGE_CREDENTIAL),e=safeStorageGet(STORAGE_EMAIL);
if(c&&e){
const normalized=e.toLowerCase().trim();
if(normalized){
googleCredential=c;userEmail=normalized;userName=EMAIL_NAME_MAP[normalized]||'';isAuthenticated=true;updateUIAfterLogin();
}
}}
function getRedirectUri(){return 'https://jkdrycleaner.github.io/Salon_Dashboard/Expenses.html'}
function randomString(length=32){
const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let out='';const bytes=new Uint8Array(length);crypto.getRandomValues(bytes);
for(let i=0;i<length;i++)out+=chars[bytes[i]%chars.length];return out;
}

async function startGoogleLogin(){
try{
const state=randomString();safeStorageSet('salon_expense_oauth_state',state);
const params=new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:getRedirectUri(),response_type:'token',scope:'openid email profile',state,include_granted_scopes:'true',prompt:'select_account'});
showStatus('Opening Google Sign-In...','loading');
window.location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+params.toString());
}catch(e){showStatus('Google Sign-In could not be started. Please try again.','error')}
}

async function handleOAuthReturn(){
const hash=location.hash?location.hash.substring(1):'';if(!hash)return;
const p=new URLSearchParams(hash),error=p.get('error'),accessToken=p.get('access_token'),returnedState=p.get('state'),savedState=safeStorageGet('salon_expense_oauth_state');
history.replaceState(null,document.title,location.pathname+location.search);
if(error){safeStorageRemove('salon_expense_oauth_state');showStatus('Google Sign-In was cancelled or denied.','error');return}
if(!accessToken){showStatus('Google Sign-In did not return an account. Please try again.','error');return}
if(savedState&&returnedState&&savedState!==returnedState){showStatus('Google verification failed. Please try again.','error');return}
try{
showStatus('Verifying Google account...','loading');
const r=await fetch('https://openidconnect.googleapis.com/v1/userinfo',{headers:{Authorization:'Bearer '+accessToken}});
if(!r.ok)throw new Error('Google account verification failed.');
const info=await r.json(),normalized=(info.email||'').toLowerCase().trim();
googleCredential=accessToken;userEmail=normalized;userName=EMAIL_NAME_MAP[normalized]||'';isAuthenticated=true;
safeStorageSet(STORAGE_CREDENTIAL,googleCredential);safeStorageSet(STORAGE_EMAIL,userEmail);safeStorageRemove('salon_expense_oauth_state');
updateUIAfterLogin();hideStatus();
}catch(e){
googleCredential=null;userEmail='';userName='';isAuthenticated=false;safeStorageRemove(STORAGE_CREDENTIAL);safeStorageRemove(STORAGE_EMAIL);
showStatus(e.message||'Google account verification failed.','error');
}}

function populateSalaryMonths(){
const select=document.getElementById('salaryMonth');
const now=new Date();
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
let options='<option value="">Select Salary Month</option>';
for(let offset=2;offset>=0;offset--){
const d=new Date(now.getFullYear(),now.getMonth()-offset,1);
const label=monthNames[d.getMonth()];
options+='<option value="'+label+'">'+label+'</option>';
}
select.innerHTML=options;
}

function toggleSalaryMonth(){
const isSalary=document.getElementById('expenseType').value==='Salary';
const group=document.getElementById('salaryMonthGroup');
const select=document.getElementById('salaryMonth');
group.style.display=isSalary?'block':'none';
select.required=isSalary;
if(isSalary){populateSalaryMonths();}else{select.value='';}
}

async function sendExpenseToSheet(d){
const f=new URLSearchParams();
f.append('action','expense');f.append('email',d.email);f.append('name',d.name);f.append('expenseType',d.expenseType);
f.append('paymentMode',d.paymentMode);f.append('amount',d.amount);f.append('salaryMonth',d.salaryMonth||'');f.append('remark',d.remark);f.append('credential',googleCredential);
await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:f.toString()});
return true;
}

document.getElementById('googleSignInBtn').addEventListener('click',startGoogleLogin);
document.getElementById('expenseType').addEventListener('change',toggleSalaryMonth);

document.getElementById('expenseForm').addEventListener('submit',async function(ev){
ev.preventDefault();if(isSubmitting)return;hideStatus();
if(!googleCredential||!isAuthenticated){showStatus('Please sign in with Google first.','error');return}
const expenseType=document.getElementById('expenseType').value,paymentMode=document.getElementById('paymentMode').value;
const selectedName=document.getElementById('nameSelect').value;
const finalName=EMAIL_NAME_MAP[userEmail] || selectedName;
const salaryMonth=document.getElementById('salaryMonth').value;
const amount=parseFloat(document.getElementById('amount').value)||0,remark=document.getElementById('remark').value.trim();
if(!expenseType){showStatus('Please select Expense Type.','error');return}
if(expenseType==='Salary'&&!salaryMonth){showStatus('Please select Salary Month.','error');return}
if(!finalName){showStatus('Please select Name.','error');return}
if(amount<=0){showStatus('Please enter a valid amount.','error');return}
isSubmitting=true;const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Saving...';showStatus('Saving expense...','loading');
try{
await sendExpenseToSheet({email:userEmail,name:finalName,expenseType,paymentMode,amount,salaryMonth,remark});
document.getElementById('expenseType').value='';document.getElementById('paymentMode').value='Cash';document.getElementById('amount').value='';document.getElementById('salaryMonth').value='';document.getElementById('remark').value='';
document.getElementById('nameSelect').value='';
toggleSalaryMonth();
showStatus('Expense saved successfully. Ready for new expense.','success');setTimeout(hideStatus,2500);
}catch(e){showStatus('Failed to save: '+e.message,'error')}
isSubmitting=false;b.disabled=false;b.textContent='Save and New Expense';
});

document.getElementById('dashboardBtn').addEventListener('click',()=>location.href=DASHBOARD_URL);
window.addEventListener('load',async()=>{await handleOAuthReturn();checkExistingSession()});
</script>
</body>
</html>
