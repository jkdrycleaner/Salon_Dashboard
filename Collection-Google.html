<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOURS SALON — Add Entry</title>

<!-- Google Sign-In -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #12100E;
  color: #F3EEE3;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: #1B1815;
  border: 1px solid #332C22;
  border-radius: 12px;
  padding: 28px 24px 32px;
  max-width: 480px;
  width: 100%;
}

.logo {
  font-size: 24px;
  font-weight: 700;
  color: #C9A227;
  margin-bottom: 20px;
  border-bottom: 1px solid #332C22;
  padding-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.logo span {
  color: #E4C55C;
}

h2 {
  font-size: 20px;
  margin-bottom: 4px;
}

.sub {
  color: #9C9284;
  font-size: 12px;
  margin-bottom: 20px;
}

/* Google login area */

.login-box {
  background: #242019;
  border: 1px solid #332C22;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 20px;
}

.login-title {
  font-size: 12px;
  color: #9C9284;
  margin-bottom: 10px;
}

#userEmail {
  display: none;
  color: #8FD4C4;
  font-size: 13px;
  margin-top: 10px;
  word-break: break-all;
}

#userEmail.authenticated {
  display: block;
  color: #8FD4C4;
}

/* Form - Initially Hidden */
#entryForm {
  display: none;
}

#entryForm.visible {
  display: block;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 10px;
  color: #9C9284;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group select {
  width: 100%;
  background: #242019;
  border: 1px solid #332C22;
  border-radius: 8px;
  padding: 10px 14px;
  color: #F3EEE3;
  font-size: 15px;
  outline: none;
  transition: border-color 0.3s ease;
}

.form-group input:focus,
.form-group select:focus {
  border-color: #C9A227;
}

.form-group input::placeholder {
  color: #5A5042;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn {
  width: 100%;
  background: #C9A227;
  color: #1B1508;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.3s ease, opacity 0.3s ease;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn:hover:not(:disabled) {
  background: #E4C55C;
}

.btn-logout {
  background: #332C22;
  color: #F3EEE3;
  margin-top: 8px;
  font-size: 13px;
  padding: 8px;
}

.btn-logout:hover:not(:disabled) {
  background: #4A3F33;
}

/* ✅ GitHub Style Commit Info Bar - Hidden by default */
.commit-info {
  background: #242019;
  border: 1px solid #332C22;
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 14px;
  display: none;
  font-size: 12px;
  color: #9C9284;
}

.commit-info.visible {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.commit-info .commit-time {
  color: #8FD4C4;
}

.commit-info .commit-count {
  color: #C9A227;
}

.commit-info .commit-icon {
  color: #E4C55C;
  margin-right: 6px;
}

.commit-info .commit-hash {
  color: #C9A227;
  font-family: monospace;
  font-size: 11px;
  background: #12100E;
  padding: 2px 8px;
  border-radius: 4px;
}

#status {
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}

#status.success {
  display: block;
  background: rgba(62,130,114,0.2);
  border: 1px solid #3E8272;
  color: #8FD4C4;
}

#status.error {
  display: block;
  background: rgba(181,71,63,0.2);
  border: 1px solid #B5473F;
  color: #E88A82;
}

#status.loading {
  display: block;
  background: rgba(201,162,39,0.05);
  border: 1px solid #332C22;
  color: #9C9284;
}

#status.info {
  display: block;
  background: rgba(201,162,39,0.1);
  border: 1px solid #C9A227;
  color: #E4C55C;
}

/* Hide Google Sign-In button after authentication */
#g_id_signin {
  transition: opacity 0.3s ease;
}

#g_id_signin.hidden {
  display: none;
}

@media(max-width:480px) {
  .form-row {
    grid-template-columns: 1fr;
  }
  
  .container {
    padding: 20px 16px 24px;
  }
  
  .commit-info.visible {
    flex-direction: column;
    gap: 4px;
    text-align: center;
  }
  
  .logo {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    YOURS <span>SALON</span>
  </div>

  <h2>📝 Add New Entry</h2>

  <div class="sub">
    Sign in to add transaction details
  </div>


  <!-- ========================================
       GOOGLE SIGN IN
       ======================================== -->

  <div class="login-box">

    <div class="login-title">
      Sign in with your Google account
    </div>

    <div
      id="g_id_onload"
      data-client_id="326263063666-ndmfvf4eidtvdkr5imc19din2evqbinv.apps.googleusercontent.com"
      data-callback="handleGoogleLogin"
      data-auto_prompt="false">
    </div>

    <div
      id="g_id_signin"
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular">
    </div>

    <div id="userEmail"></div>

    <!-- Logout Button (hidden initially) -->
    <button 
      id="logoutBtn" 
      class="btn btn-logout" 
      style="display: none;"
      onclick="logoutUser()">
      Sign Out
    </button>

  </div>


  <!-- ========================================
       ENTRY FORM (Hidden until auth)
       ======================================== -->

  <form id="entryForm">

    <div class="form-group">
      <label>Staff Name</label>
      <select id="staff" required>
        <option value="">Select Staff Member</option>
        <option value="Amir Khan">Amir Khan</option>
        <option value="Ashu Kumar">Ashu Kumar</option>
        <option value="Jaan Mohd">Jaan Mohd</option>
        <option value="Suhail Khan">Suhail Khan</option>
      </select>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Payment Mode</label>
        <select id="payment">
          <option value="Cash">Cash</option>
          <option value="Online" selected>Online</option>
        </select>
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <input
          type="number"
          id="amount"
          placeholder="0"
          min="1"
          step="1"
          required
        >
      </div>

    </div>

    <div class="form-group">
      <label>Cost Cutting (₹)</label>
      <input
        type="number"
        id="cost"
        placeholder="0"
        min="0"
        step="1"
      >
    </div>

    <div class="form-group">
      <label>Service Type</label>
      <input
        type="text"
        id="serviceType"
        placeholder="e.g., Haircut, Coloring, Facial, etc."
        required
      >
    </div>

    <button
      type="submit"
      class="btn"
      id="submitBtn">
      + Add Entry
    </button>

  </form>

  <!-- ✅ GitHub Style Commit Info Bar - Sirf Login Ke Baad Dikhega -->
  <div class="commit-info" id="commitInfo">
    <span>
      <span class="commit-icon">📦</span> 
      Latest commit: <span class="commit-time" id="latestCommitTime">Loading...</span>
    </span>
    <span>
      <span class="commit-icon">🔑</span> 
      Commit: <span class="commit-hash" id="latestCommitHash">------</span>
    </span>
    <span>
      <span class="commit-icon">📊</span> 
      Total entries: <span class="commit-count" id="totalEntries">0</span>
    </span>
  </div>

  <div id="status"></div>

</div>


<script>

// ========================================
// ⚙️ CONFIGURATION - GITHUB REPO DETAILS
// ========================================

// ✅ YOUR GITHUB REPO DETAILS
const GITHUB_USERNAME = 'jkdrycleaner';
const GITHUB_REPO = 'Salon_Dashboard';
const GITHUB_BRANCH = 'main';
const GITHUB_FILE = 'Collection-Google.html';

// ✅ Google Apps Script URL
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6zO6TXGWx78gtTxr1ADKbwgXjBr6hr75DdRKQawTbMJYHLBt5y6Lv8FvIaHhTjESY7g/exec';

// ✅ Google Client ID
const GOOGLE_CLIENT_ID = '326263063666-ndmfvf4eidtvdkr5imc19din2evqbinv.apps.googleusercontent.com';


// ========================================
// STATE
// ========================================

let googleCredential = null;
let userEmail = '';
let isAuthenticated = false;
let isSubmitting = false;


// ========================================
// PAGE LOAD
// ========================================

window.addEventListener('load', function() {
  checkExistingSession();
});


// ========================================
// ✅ GITHUB API - LAST COMMIT FETCH (Sirf Login Ke Baad)
// ========================================

async function getGitHubLastCommit() {
  // ✅ Sirf tab fetch karo jab user authenticated ho
  if (!isAuthenticated) {
    console.log('⏳ User not authenticated. Skipping GitHub fetch.');
    return;
  }

  try {
    console.log('📡 Fetching GitHub commit info...');
    
    const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits?path=${GITHUB_FILE}&page=1&per_page=1`;
    
    const response = await fetch(apiUrl);
    
    if (!response.ok) {
      throw new Error(`GitHub API error: ${response.status}`);
    }
    
    const data = await response.json();
    
    if (data && data.length > 0) {
      const commit = data[0];
      const commitDate = new Date(commit.commit.author.date);
      const commitHash = commit.sha.substring(0, 7);
      
      const timeStr = formatTime(commitDate);
      const timeAgo = getTimeAgo(commitDate);
      
      // ✅ UPDATE UI - Bottom Info Bar
      document.getElementById('latestCommitTime').textContent = timeStr + ' (' + timeAgo + ')';
      document.getElementById('latestCommitHash').textContent = commitHash;
      document.getElementById('commitInfo').classList.add('visible');
      
      console.log('✅ GitHub commit found:', { hash: commitHash, time: timeStr });
      
      // Save to localStorage
      const commitData = {
        time: timeStr,
        timeAgo: timeAgo,
        hash: commitHash,
        timestamp: commitDate.getTime()
      };
      localStorage.setItem('githubLastCommit', JSON.stringify(commitData));
      
      return commitData;
      
    } else {
      console.log('No commits found');
      document.getElementById('latestCommitTime').textContent = 'No commits yet';
      document.getElementById('latestCommitHash').textContent = '------';
      document.getElementById('commitInfo').classList.add('visible');
    }
    
  } catch (error) {
    console.error('❌ GitHub API error:', error);
    
    // ✅ Try cached data
    const cached = localStorage.getItem('githubLastCommit');
    if (cached) {
      try {
        const data = JSON.parse(cached);
        document.getElementById('latestCommitTime').textContent = data.time + ' (' + data.timeAgo + ')';
        document.getElementById('latestCommitHash').textContent = data.hash;
        document.getElementById('commitInfo').classList.add('visible');
        console.log('📦 Using cached commit info');
      } catch(e) {
        document.getElementById('latestCommitTime').textContent = 'Not available';
        document.getElementById('latestCommitHash').textContent = '------';
        document.getElementById('commitInfo').classList.add('visible');
      }
    } else {
      document.getElementById('latestCommitTime').textContent = 'Not available';
      document.getElementById('latestCommitHash').textContent = '------';
      document.getElementById('commitInfo').classList.add('visible');
    }
  }
}


// ========================================
// ✅ TIME FORMAT FUNCTIONS
// ========================================

function formatTime(date) {
  const options = {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  };
  return date.toLocaleString('en-IN', options);
}

function getTimeAgo(date) {
  const now = new Date();
  const diff = Math.floor((now - date) / 1000);
  
  if (diff < 60) return 'Just now';
  if (diff < 120) return '1 minute ago';
  if (diff < 3600) return Math.floor(diff / 60) + ' minutes ago';
  if (diff < 7200) return '1 hour ago';
  if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago';
  if (diff < 172800) return 'Yesterday';
  if (diff < 604800) return Math.floor(diff / 86400) + ' days ago';
  if (diff < 2592000) return Math.floor(diff / 604800) + ' weeks ago';
  return date.toLocaleDateString('en-IN');
}


// ========================================
// ✅ LOAD COMMIT INFO FROM SHEET
// ========================================

function loadCommitInfoFromSheet() {
  try {
    const savedTime = localStorage.getItem('lastCommitTime');
    const savedCount = localStorage.getItem('totalEntries');
    
    if (savedTime && savedCount) {
      document.getElementById('latestCommitTime').textContent = savedTime;
      document.getElementById('totalEntries').textContent = savedCount;
      document.getElementById('commitInfo').classList.add('visible');
    }
  } catch (e) {
    console.log('Could not load sheet info');
  }
}


// ========================================
// ✅ UPDATE COMMIT INFO AFTER SAVE
// ========================================

function updateCommitInfoAfterSave() {
  const now = new Date();
  const timeStr = formatTime(now);
  const timeAgo = getTimeAgo(now);
  
  let count = parseInt(document.getElementById('totalEntries').textContent) || 0;
  count++;
  
  document.getElementById('latestCommitTime').textContent = timeStr + ' (' + timeAgo + ')';
  document.getElementById('totalEntries').textContent = count;
  document.getElementById('commitInfo').classList.add('visible');
  
  localStorage.setItem('lastCommitTime', timeStr);
  localStorage.setItem('totalEntries', count);
}


// ========================================
// CHECK EXISTING SESSION
// ========================================

function checkExistingSession() {
  const storedCredential = sessionStorage.getItem('googleCredential');
  const storedEmail = sessionStorage.getItem('userEmail');
  
  if (storedCredential && storedEmail) {
    googleCredential = storedCredential;
    userEmail = storedEmail;
    isAuthenticated = true;
    updateUIAfterLogin();
    console.log('Session restored for:', userEmail);
    showStatus('Session restored. Welcome back!', 'info');
    setTimeout(hideStatus, 3000);
    
    // ✅ Login ke baad GitHub commit info fetch karo
    getGitHubLastCommit();
    loadCommitInfoFromSheet();
  }
}


// ========================================
// GOOGLE LOGIN CALLBACK
// ========================================

function handleGoogleLogin(response) {

  console.log('Google login successful');

  googleCredential = response.credential;
  sessionStorage.setItem('googleCredential', googleCredential);

  try {
    const parts = response.credential.split('.');
    const payload = JSON.parse(
      atob(
        parts[1]
          .replace(/-/g, '+')
          .replace(/_/g, '/')
      )
    );

    userEmail = payload.email || '';
    sessionStorage.setItem('userEmail', userEmail);
    isAuthenticated = true;
    updateUIAfterLogin();
    showStatus('✅ Successfully authenticated as: ' + userEmail, 'success');

    // ✅ Login ke baad GitHub commit info fetch karo
    getGitHubLastCommit();
    loadCommitInfoFromSheet();

  } catch (error) {
    console.error('Google credential decode error:', error);
    showStatus('Google login error. Please try again.', 'error');
  }
}


// ========================================
// UPDATE UI AFTER LOGIN
// ========================================

function updateUIAfterLogin() {
  const emailBox = document.getElementById('userEmail');
  emailBox.textContent = '✅ Authenticated as: ' + userEmail;
  emailBox.className = 'authenticated';
  emailBox.style.display = 'block';

  document.getElementById('g_id_signin').classList.add('hidden');
  document.getElementById('logoutBtn').style.display = 'block';
  document.getElementById('entryForm').classList.add('visible');
  document.getElementById('entryForm').style.display = 'block';
}


// ========================================
// LOGOUT FUNCTION
// ========================================

function logoutUser() {
  googleCredential = null;
  userEmail = '';
  isAuthenticated = false;
  sessionStorage.removeItem('googleCredential');
  sessionStorage.removeItem('userEmail');
  
  const emailBox = document.getElementById('userEmail');
  emailBox.textContent = '';
  emailBox.className = '';
  emailBox.style.display = 'none';
  
  document.getElementById('g_id_signin').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('entryForm').classList.remove('visible');
  document.getElementById('entryForm').style.display = 'none';
  document.getElementById('entryForm').reset();
  
  document.getElementById('cost').value = '';
  
  // ✅ Logout ke baad commit info hide karo
  document.getElementById('commitInfo').classList.remove('visible');
  
  hideStatus();
  showStatus('🔒 Signed out successfully', 'info');
  setTimeout(hideStatus, 3000);
}


// ========================================
// STATUS
// ========================================

function showStatus(message, type) {
  const status = document.getElementById('status');
  status.textContent = message;
  status.className = type;
  status.style.display = 'block';
}


function hideStatus() {
  const status = document.getElementById('status');
  status.textContent = '';
  status.className = '';
  status.style.display = 'none';
}


// ========================================
// SEND DATA TO GOOGLE SHEET
// ========================================

async function sendToSheet(data) {
  const formData = new URLSearchParams();

  formData.append('staff', data.staff);
  formData.append('paymentMode', data.paymentMode);
  formData.append('amount', data.amount);
  formData.append('costCutting', data.costCutting);
  formData.append('serviceType', data.serviceType);
  formData.append('credential', googleCredential);

  console.log('📤 Sending data:', {
    staff: data.staff,
    paymentMode: data.paymentMode,
    amount: data.amount,
    costCutting: data.costCutting,
    serviceType: data.serviceType
  });

  await fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
    },
    body: formData.toString()
  });

  return true;
}


// ========================================
// FORM SUBMIT
// ========================================

document
  .getElementById('entryForm')
  .addEventListener(
    'submit',
    async function(e) {

      e.preventDefault();

      if (isSubmitting) return;
      hideStatus();

      if (!googleCredential || !isAuthenticated) {
        showStatus('⚠️ Please sign in with Google first.', 'error');
        return;
      }

      const staff = document.getElementById('staff').value;
      const payment = document.getElementById('payment').value;
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      
      const costInput = document.getElementById('cost').value;
      const cost = costInput === '' ? 0 : parseFloat(costInput) || 0;
      
      const serviceType = document.getElementById('serviceType').value.trim();

      // Validation
      if (!staff) {
        showStatus('Please select a staff member.', 'error');
        return;
      }

      if (amount <= 0) {
        showStatus('Please enter a valid amount (greater than 0).', 'error');
        return;
      }
      
      if (!serviceType) {
        showStatus('Please enter the service type.', 'error');
        return;
      }

      const data = {
        staff: staff,
        paymentMode: payment,
        amount: amount,
        costCutting: cost,
        serviceType: serviceType
      };

      isSubmitting = true;
      const button = document.getElementById('submitBtn');
      button.disabled = true;
      button.textContent = 'Saving...';
      showStatus('Saving...', 'loading');

      try {
        await sendToSheet(data);

        document.getElementById('staff').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('cost').value = '';
        document.getElementById('serviceType').value = '';

        // ✅ Update commit info after successful save
        updateCommitInfoAfterSave();

        showStatus('✅ Saved successfully!', 'success');
        setTimeout(hideStatus, 5000);

      } catch (error) {
        console.error('Submission error:', error);
        showStatus('❌ Failed to save: ' + error.message, 'error');
      }

      isSubmitting = false;
      button.disabled = false;
      button.textContent = '+ Add Entry';
    }
  );

</script>

</body>
</html>
