<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOURS SALON — Add Entry</title>

<!-- Google Sign-In -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #12100E;
  color: #F3EEE3;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: #1B1815;
  border: 1px solid #332C22;
  border-radius: 12px;
  padding: 28px 24px 32px;
  max-width: 480px;
  width: 100%;
}

.logo {
  font-size: 24px;
  font-weight: 700;
  color: #C9A227;
  margin-bottom: 20px;
  border-bottom: 1px solid #332C22;
  padding-bottom: 16px;
}

.logo span {
  color: #E4C55C;
}

h2 {
  font-size: 20px;
  margin-bottom: 4px;
}

.sub {
  color: #9C9284;
  font-size: 12px;
  margin-bottom: 20px;
}

/* Google login area */

.login-box {
  background: #242019;
  border: 1px solid #332C22;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 20px;
}

.login-title {
  font-size: 12px;
  color: #9C9284;
  margin-bottom: 10px;
}

#userEmail {
  display: none;
  color: #8FD4C4;
  font-size: 13px;
  margin-top: 10px;
  word-break: break-all;
}

#userEmail.authenticated {
  display: block;
  color: #8FD4C4;
  background: rgba(62,130,114,0.15);
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #3E8272;
}

/* Form - Initially Hidden */
#entryForm {
  display: none;
}

#entryForm.visible {
  display: block;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 10px;
  color: #9C9284;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group select {
  width: 100%;
  background: #242019;
  border: 1px solid #332C22;
  border-radius: 8px;
  padding: 10px 14px;
  color: #F3EEE3;
  font-size: 15px;
  outline: none;
  transition: border-color 0.3s ease;
}

.form-group input:focus,
.form-group select:focus {
  border-color: #C9A227;
}

.form-group input::placeholder {
  color: #5A5042;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn {
  width: 100%;
  background: #C9A227;
  color: #1B1508;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.3s ease, opacity 0.3s ease;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.dashboard-btn {
  margin-top: 8px;
  background: #332C22;
  color: #F3EEE3;
}

.dashboard-btn:hover:not(:disabled) {
  background: #4A3F33;
}

.btn:hover:not(:disabled) {
  background: #E4C55C;
}

.btn-logout {
  background: #332C22;
  color: #F3EEE3;
  margin-top: 8px;
  font-size: 13px;
  padding: 8px;
}

.btn-logout:hover:not(:disabled) {
  background: #4A3F33;
}

#status {
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}

#status.success {
  display: block;
  background: rgba(62,130,114,0.2);
  border: 1px solid #3E8272;
  color: #8FD4C4;
}

#status.error {
  display: block;
  background: rgba(181,71,63,0.2);
  border: 1px solid #B5473F;
  color: #E88A82;
}

#status.loading {
  display: block;
  background: rgba(201,162,39,0.05);
  border: 1px solid #332C22;
  color: #9C9284;
}

#status.info {
  display: block;
  background: rgba(201,162,39,0.1);
  border: 1px solid #C9A227;
  color: #E4C55C;
}

/* Hide Google Sign-In button after authentication */
#g_id_signin {
  transition: opacity 0.3s ease;
}

#g_id_signin.hidden {
  display: none;
}

@media(max-width:480px) {
  .form-row {
    grid-template-columns: 1fr;
  }
  
  .container {
    padding: 20px 16px 24px;
  }
}

/* ========================================
   FINAL MOBILE / SINGLE-SCREEN UI
   ======================================== */

.login-box {
  position: relative;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0 0 8px;
  min-height: 0;
}

#userEmail.authenticated {
  position: absolute;
  top: -42px;
  right: 2px;
  width: 28px;
  height: 28px;
  display: flex !important;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
  background: transparent;
  border: 0;
  color: #C9A227;
  font-size: 18px;
  cursor: help;
}

#userEmail.authenticated::after {
  content: attr(data-email);
  position: fixed;
  top: 12px;
  right: 18px;
  max-width: 220px;
  color: #9C9284;
  font-size: 10px;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}

#logoutBtn {
  display: none !important;
}

#entryForm.visible {
  display: block;
}

@media (max-width: 600px) {
  html,
  body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
  }

  body {
    padding: 0;
    align-items: stretch;
    justify-content: stretch;
  }

  .container {
    width: 100%;
    max-width: none;

  }

  .sub {
    font-size: 10px;
    margin-bottom: 8px;
  }

  .login-box {
    margin: 0;
    height: 0;
    overflow: visible;
  }

  #userEmail.authenticated {

  }

  /* iPhone / mobile: Google sign-in must remain visible until authenticated */
  #g_id_signin {

  }

  #entryForm {

  }

  .form-group {
    margin-bottom: 8px;
  }

  .form-group label {
    font-size: 9px;
    margin-bottom: 3px;
  }

  .form-group input,
  .form-group select {
    height: 34px;
    min-height: 34px;
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 7px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }

  #entryForm button {
    width: 100%;
    height: 36px;

    margin-top: 2px;
  }

  #status {

}

@media (max-width: 600px) and (max-height: 700px) {
  .container {
    padding-top: 10px;
    padding-bottom: 8px;
  }

  .logo {

  }

  .sub {

  }

  .form-group {

  }

  .form-group input,

    min-height: 33px;

}


/* ANDROID CHROME HELPER */
#chromeOpenBox {
  display: none;

#iosOpenBox {

#iosOpenBox button {

<div id="chromeOpenBox" style="display:none;">

<div class="container">

  <!-- ========================================

  <div class="login-box">

      data-auto_prompt="false"
      data-auto_select="false"

      data-login_uri="https://script.google.com/macros/s/AKfycbwHRNE9vw17BDgUgVVOVdIyl4hFMtjBEzqxCkDUuB1ncER6WsLAADtAMrmeCB3IWmQr5g/exec"

<script>

// ========================================
// GOOGLE APPS SCRIPT URL
// ========================================

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbwHRNE9vw17BDgUgVVOVdIyl4hFMtjBEzqxCkDUuB1ncER6WsLAADtAMrmeCB3IWmQr5g/exec';


// ========================================
// GOOGLE CLIENT ID
// ========================================

const GOOGLE_CLIENT_ID =
'326263063666-ndmfvf4eidtvdkr5imc19din2evqbinv.apps.googleusercontent.com';


// ========================================
// CURRENT GOOGLE USER
// ========================================

let googleCredential = null;
let userEmail = '';
let isAuthenticated = false;

// Check for existing session on page load

// ========================================
// ANDROID CHROME HELPER — DOES NOT TOUCH AUTH
// ========================================

function setupAndroidChromeButton() {
  const ua = navigator.userAgent || '';
  const isAndroid = /Android/i.test(ua);

  // Detect Android in-app WebViews only.
  const isInApp =
    /\bwv\b/i.test(ua) ||
    /; wv\)/i.test(ua) ||
    /FBAN|FBAV|Instagram|WhatsApp|GSA\//i.test(ua);

  if (!isAndroid || !isInApp) return;

  const box = document.getElementById('chromeOpenBox');
  const button = document.getElementById('openChromeBtn');

  if (!box || !button) return;

  box.style.display = 'block';

  button.addEventListener('click', function () {
    const url = window.location.href;
    const withoutScheme = url.replace(/^https?:\/\//i, '');

    window.location.href =
      'intent://' + withoutScheme +
      '#Intent;scheme=https;package=com.android.chrome;end';
  });
}


// ========================================
// iOS IN-APP BROWSER HELPER
// ========================================

function setupIOSBrowserButton() {
  const ua = navigator.userAgent || '';

  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const isInApp =
    /FBAN|FBAV|Instagram|WhatsApp|GSA\//i.test(ua);

  if (!isIOS) return;

  const note = document.getElementById('iosLoginNote');
  if (note) note.style.display = 'block';

  if (!isInApp) return;

  const box = document.getElementById('iosOpenBox');
  const button = document.getElementById('openBrowserBtn');

  if (!box || !button) return;

  box.style.display = 'block';

  button.addEventListener('click', function () {
    // Opening a new browsing context gives iOS/WhatsApp the
    // opportunity to hand the page to the system browser.
    const opened = window.open(window.location.href, '_blank');

    // If the in-app browser keeps the new page inside itself,
    // the visible helper text tells the user to use “Open in Safari”.
    if (!opened) {
      showStatus(
        'Please use the browser menu and choose “Open in Safari”.',
        'info'
      );
    }
  });
}

window.addEventListener('load', function() {
  setupAndroidChromeButton();
  setupIOSBrowserButton();
  consumeRedirectAuth();
  checkExistingSession();

  // Google Sign-In is user-gesture driven.
  // On iOS Safari, redirect UX is used because of ITP.
});


// ========================================
// CHECK EXISTING SESSION
// ========================================

const STORAGE_CREDENTIAL = 'salon_google_credential';
const STORAGE_EMAIL = 'salon_user_email';

function decodeJwtPayload(token) {
  try {
    const parts = token.split('.');
    if (parts.length !== 3) return null;

    return JSON.parse(
      atob(
        parts[1]
          .replace(/-/g, '+')
          .replace(/_/g, '/')
      )
    );
  } catch (error) {
    console.error('JWT decode error:', error);
    return null;
  }
}

function isCredentialValid(token) {
  const payload = decodeJwtPayload(token);

  if (!payload) return false;

  // ID tokens contain exp as Unix seconds.
  // Keep a 60-second safety buffer.
  if (payload.exp && (Date.now() / 1000) >= (payload.exp - 60)) {
    return false;
  }

  return true;
}


function consumeRedirectAuth() {
  const params = new URLSearchParams(window.location.search);
  const authKey = params.get('google_auth');

  if (!authKey) return;

  // Remove the key from the visible URL immediately.
  try {
    const cleanUrl =
      window.location.origin +
      window.location.pathname +
      window.location.hash;
    window.history.replaceState({}, document.title, cleanUrl);
  } catch (e) {}

  const callbackName =
    '__salonAuthCallback_' + Date.now();

  window[callbackName] = function (payload) {
    try {
      if (!payload || !payload.credential) {
        showStatus(
          (payload && payload.message) ||
          'Google sign-in could not be completed.',
          'error'
        );
        return;
      }

      handleGoogleLogin({
        credential: payload.credential
      });

    } catch (error) {
      console.error('Redirect authentication error:', error);
      showStatus(
        'Google sign-in could not be completed. Please try again.',
        'error'
      );
    } finally {
      try {
        delete window[callbackName];
      } catch (e) {}
    }
  };

  const script = document.createElement('script');
  script.src =
    'https://script.google.com/macros/s/AKfycbwHRNE9vw17BDgUgVVOVdIyl4hFMtjBEzqxCkDUuB1ncER6WsLAADtAMrmeCB3IWmQr5g/exec' +
    '?action=consumeAuth&key=' +
    encodeURIComponent(authKey) +
    '&callback=' +
    encodeURIComponent(callbackName);

  script.onerror = function () {
    showStatus(
      'Google sign-in response could not be loaded. Please try again.',
      'error'
    );
    try {
      delete window[callbackName];
    } catch (e) {}
  };

  document.head.appendChild(script);
}

function checkExistingSession() {

  // First use persistent storage so a page reload/new tab on the
  // same phone does not force Google authentication again.
  let storedCredential =
    localStorage.getItem(STORAGE_CREDENTIAL);

  let storedEmail =
    localStorage.getItem(STORAGE_EMAIL);

  // Migrate the previous sessionStorage values if they exist.
  if (!storedCredential || !storedEmail) {
    const oldCredential =
      sessionStorage.getItem('googleCredential');

    const oldEmail =
      sessionStorage.getItem('userEmail');

    if (oldCredential && oldEmail) {
      storedCredential = oldCredential;
      storedEmail = oldEmail;

      localStorage.setItem(
        STORAGE_CREDENTIAL,
        storedCredential
      );

      localStorage.setItem(
        STORAGE_EMAIL,
        storedEmail
      );
    }
  }

  // Restore only a still-valid Google ID token.
  if (
    storedCredential &&
    storedEmail &&
    isCredentialValid(storedCredential)
  ) {

    googleCredential = storedCredential;
    userEmail = storedEmail;
    isAuthenticated = true;

    updateUIAfterLogin();

    console.log(
      'Persistent Google session restored for:',
      userEmail
    );

    return;
  }

  // Expired/invalid credential: remove it and allow Google
  // Identity Services to authenticate again.
  localStorage.removeItem(STORAGE_CREDENTIAL);
  localStorage.removeItem(STORAGE_EMAIL);

  sessionStorage.removeItem('googleCredential');
  sessionStorage.removeItem('userEmail');

  googleCredential = null;
  userEmail = '';
  isAuthenticated = false;

  // Make sure the Google sign-in control is available when
  // a fresh authentication is actually required.
  const signInButton =
    document.getElementById('g_id_signin');

  if (signInButton) {
    signInButton.classList.remove('hidden');
  }

  const form =
    document.getElementById('entryForm');

  if (form) {
    form.classList.remove('visible');
    form.style.display = 'none';
  }
}


// ========================================

// GOOGLE LOGIN CALLBACK
// ========================================

function handleGoogleLogin(response) {

  console.log('Google login successful');

  googleCredential = response.credential;
  
  // Persist the Google session on this device/browser.
  // The credential is restored only while its JWT is valid.
  localStorage.setItem(
    STORAGE_CREDENTIAL,
    googleCredential
  );

  sessionStorage.setItem(
    'googleCredential',
    googleCredential
  );

  // JWT payload decode
  try {

    const parts = response.credential.split('.');
    const payload =
      JSON.parse(
        atob(
          parts[1]
            .replace(/-/g, '+')
            .replace(/_/g, '/')
        )
      );

    userEmail = payload.email || '';
    
    // Persist the email so the same signed-in account
    // is restored on the same device/browser.
    localStorage.setItem(
      STORAGE_EMAIL,
      userEmail
    );

    sessionStorage.setItem(
      'userEmail',
      userEmail
    );

    isAuthenticated = true;
    
    // Update UI
    updateUIAfterLogin();

    hideStatus();

  } catch (error) {

    console.error(
      'Google credential decode error:',
      error
    );

    showStatus(
      'Google login error. Please try again.',
      'error'
    );

  }
}


// ========================================
// UPDATE UI AFTER LOGIN
// ========================================

function updateUIAfterLogin() {
  const iosBox = document.getElementById('iosOpenBox');
  if (iosBox) {
    iosBox.style.display = 'none';
  }

  // Show user email
  const emailBox = document.getElementById('userEmail');
  emailBox.textContent = '✉';
  emailBox.title = userEmail;
  emailBox.dataset.email = userEmail;
  emailBox.className = 'authenticated';
  emailBox.style.display = 'flex';

  // Hide Google Sign-In button
  document.getElementById('g_id_signin').classList.add('hidden');

  // Keep Logout button hidden
  document.getElementById('logoutBtn').style.display = 'none';

  // Show the entry form
  document.getElementById('entryForm').classList.add('visible');
  document.getElementById('entryForm').style.display = 'block';
}


// ========================================
// LOGOUT FUNCTION
// ========================================

function logoutUser() {
  // Clear session data
  googleCredential = null;
  userEmail = '';
  isAuthenticated = false;
  
  // Clear both persistent and session storage.
  localStorage.removeItem(STORAGE_CREDENTIAL);
  localStorage.removeItem(STORAGE_EMAIL);

  sessionStorage.removeItem('googleCredential');
  sessionStorage.removeItem('userEmail');
  
  // Reset UI
  const emailBox = document.getElementById('userEmail');
  emailBox.textContent = '';
  emailBox.className = '';
  emailBox.style.display = 'none';
  
  // Show Google Sign-In button
  document.getElementById('g_id_signin').classList.remove('hidden');
  
  // Hide Logout button
  document.getElementById('logoutBtn').style.display = 'none';
  
  // Hide the entry form
  document.getElementById('entryForm').classList.remove('visible');
  document.getElementById('entryForm').style.display = 'none';
  
  // Reset form fields
  document.getElementById('entryForm').reset();
  document.getElementById('cost').value = '0';
  
  // Clear status
  hideStatus();
  
  // Show logout message
  showStatus('🔒 Signed out successfully', 'info');
  setTimeout(hideStatus, 3000);
  
  console.log('User logged out');
}


// ========================================
// STATUS
// ========================================

function showStatus(message, type) {

  const status =
    document.getElementById('status');

  status.textContent = message;
  status.className = type;
  status.style.display = 'block';
}


function hideStatus() {

  const status =
    document.getElementById('status');

  status.textContent = '';
  status.className = '';
  status.style.display = 'none';
}


// ========================================
// SEND DATA TO GOOGLE SHEET
// ========================================

async function sendToSheet(data) {

  const formData =
    new URLSearchParams();

  formData.append(
    'staff',
    data.staff
  );

  formData.append(
    'paymentMode',
    data.paymentMode
  );

  formData.append(
    'amount',
    data.amount
  );

  formData.append(
    'costCutting',
    data.costCutting
  );

  // ✅ FIXED: Service Type is now properly appended
  formData.append(
    'serviceType',
    data.serviceType
  );

  // Entry No is entered by the user and must contain numeric characters only.
  const entryNo = document.getElementById('entryNo').value.replace(/[^0-9]/g, '');

  if (!entryNo) {
    throw new Error('Please enter Entry No.');
  }

  formData.append(
    'entryNo',
    entryNo
  );

  formData.append(
    'credential',
    googleCredential
  );

  // Send the signed-in email as a fallback.
  formData.append(
    'email',
    userEmail
  );

  console.log('📤 Sending data to sheet:', {
    staff: data.staff,
    paymentMode: data.paymentMode,
    amount: data.amount,
    costCutting: data.costCutting,
    serviceType: data.serviceType,  // ✅ Now included
    entryNo: document.getElementById('entryNo').value,
    credential: googleCredential.substring(0, 20) + '...'
  });

  // Note: Using mode: 'no-cors' - ensure Apps Script handles CORS
  await fetch(SCRIPT_URL, {

    method: 'POST',

    mode: 'no-cors',

    headers: {
      'Content-Type':
        'application/x-www-form-urlencoded;charset=UTF-8'
    },

    body: formData.toString()

  });

  return true;
}


// ========================================
// FORM SUBMIT
// ========================================

let isSubmitting = false;


document
  .getElementById('entryForm')
  .addEventListener(
    'submit',
    async function(e) {

      e.preventDefault();

      if (isSubmitting) {
        return;
      }

      hideStatus();

      // Google login check
      if (!googleCredential || !isAuthenticated) {

        showStatus(
          '⚠️ Please sign in with Google first.',
          'error'
        );

        return;
      }

      // Get Values
      const staff =
        document
          .getElementById('staff')
          .value;

      const payment =
        document
          .getElementById('payment')
          .value;

      const amount =
        parseFloat(
          document
            .getElementById('amount')
            .value
        ) || 0;

      const cost =
        parseFloat(
          document
            .getElementById('cost')
            .value
        ) || 0;
        
      const serviceType =
        document
          .getElementById('serviceType')
          .value
          .trim();

      // Validation
      if (!staff) {
        showStatus(
          'Please select a staff member.',
          'error'
        );
        return;
      }

      if (amount <= 0) {
        showStatus(
          'Please enter a valid amount (greater than 0).',
          'error'
        );
        return;
      }
      
      if (!serviceType) {
        showStatus(
          'Please enter the service type.',
          'error'
        );
        return;
      }

      const data = {
        staff: staff,
        paymentMode: payment,
        amount: amount,
        costCutting: cost,
        serviceType: serviceType,  // ✅ Now included in data object
        entryNo: document.getElementById('entryNo').value.replace(/[^0-9]/g, '')
      };

      // Log the data being sent
      console.log('📝 Form Data:', data);

      isSubmitting = true;

      const button =
        document.getElementById(
          'submitBtn'
        );

      button.disabled = true;
      button.textContent = 'Saving...';

      showStatus(
        'Saving...',
        'loading'
      );

      try {

        await sendToSheet(data);

        // Clear form on success
        document
          .getElementById('staff')
          .value = '';

        document
          .getElementById('amount')
          .value = '';

        document
          .getElementById('cost')
          .value = '0';
          
        document
          .getElementById('serviceType')
          .value = '';

        document
          .getElementById('entryNo')
          .value = '';

        showStatus(
          '✅ Saved successfully!',
          'success'
        );

        // Auto-hide success message after 5 seconds
        setTimeout(hideStatus, 5000);

      } catch (error) {

        console.error('❌ Submission error:', error);

        showStatus(
          '❌ Failed to save: ' + error.message,
          'error'
        );

      }

      isSubmitting = false;
      button.disabled = false;
      button.textContent = 'Save and New Entry';

    }
  );

</script>
